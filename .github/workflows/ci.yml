name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-pipewire gstreamer1.0-tools \
            appstream desktop-file-utils gettext

      - name: Vérifier la syntaxe Python
        run: python3 -m compileall -q capturo tests

      - name: Valider AppStream
        run: appstreamcli validate data/io.github.yannick.Capturo.metainfo.xml

      - name: Valider le lanceur
        run: desktop-file-validate data/io.github.yannick.Capturo.desktop

      - name: Tester le pipeline GStreamer
        run: python3 tests/test_pipeline.py

      - name: Tester la conservation du jeton
        run: python3 tests/test_discovery.py

      - name: Construire le paquet Debian
        run: bash build.sh

      - name: Publier le paquet
        uses: actions/upload-artifact@v4
        with:
          name: capturo-deb
          path: dist/capturo_*.deb
          if-no-files-found: error
